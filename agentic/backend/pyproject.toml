[project]
name = "wtp-agent-backend"
version = "0.1.0"
description = "文象 Agent Studio 本地后端：LangGraph 编排，LangChain 接 LLM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.60",
  "langchain>=0.3.7",
  "langchain-openai>=0.2.14",
  "langchain-ollama>=0.2.2",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
